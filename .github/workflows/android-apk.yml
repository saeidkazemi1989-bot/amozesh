name: Build Android APK

on:
  push:
    branches: ['arena/71cbd6a3-amozesh']
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Unit and API tests
        run: npm test
      - name: Build web app
        env:
          VITE_API_URL: ${{ vars.GHADAM_API_URL }}
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        id: gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle-build.log 2>&1
      - name: Save build log
        if: always()
        run: |
          mkdir -p release
          cp gradle-build.log release/gradle-build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/gradle-build.log
          git commit -m "chore: save Android build log [skip ci]" || exit 0
          git push origin HEAD:arena/71cbd6a3-amozesh || true
      - name: Collect APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ghadam-android.apk
          sha256sum release/ghadam-android.apk > release/ghadam-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ghadam-android
          path: release/ghadam-android.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-latest --title "قدم برای اندروید" --notes "فایل نصبی اندروید. پیشرفت با نصب روی نسخهٔ قبلی حفظ می‌شود. سطح مبتدی ۱ رایگان است؛ سطح‌های دیگر با حساب و سرور عضویت فعال می‌شوند." release/ghadam-android.apk || gh release upload android-latest release/ghadam-android.apk --clobber
      - name: Commit APK back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/ghadam-android.apk release/ghadam-android.apk.sha256
          git commit -m "chore: build Android APK [skip ci]" || exit 0
          git push origin HEAD:arena/71cbd6a3-amozesh
